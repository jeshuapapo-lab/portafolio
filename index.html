<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeshua Sánchez | Portafolio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-zinc-950 text-zinc-100">

<header class="fixed w-full top-0 z-50 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800">
  <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <div class="text-xl font-extrabold tracking-tighter">
      JESHUA<span class="text-cyan-400">SÁNCHEZ</span>
    </div>

    <ul class="hidden md:flex space-x-8 text-sm font-medium uppercase tracking-widest text-zinc-400">
      <li><a href="#inicio" class="nav-link hover:text-white transition">Inicio</a></li>
      <li><a href="#perfil" class="nav-link hover:text-white transition">Perfil</a></li>
      <li><a href="#arsenal" class="nav-link hover:text-white transition">Arsenal</a></li>
      <li><a href="#proyectos" class="nav-link hover:text-white transition">Proyectos</a></li>
    </ul>
  </nav>
</header>

<main>
  <section id="inicio" class="min-h-screen flex items-center pt-20 px-6 max-w-7xl mx-auto">
    <div class="grid lg:grid-cols-2 gap-12 items-center w-full animate-fade-in">

      <div>
        <span class="inline-block px-3 py-1 rounded-full border border-cyan-500/30 text-cyan-400 text-xs font-bold mb-6 tracking-widest uppercase">
          IA & Desarrollo
        </span>

        <h1 class="text-6xl lg:text-8xl font-extrabold mb-6 leading-tight">
          Jeshua <br>
          <span class="gradient-text">Sánchez</span>
        </h1>

        <p class="text-xl font-light text-zinc-400 mb-10 italic">
          “Tecnología, creatividad e innovación aplicadas a soluciones reales.”
        </p>
      </div>

      <div class="relative flex justify-center items-center h-[400px] lg:h-[500px]" id="canvas-container">
        <div class="js-logo-overlay">JS</div>
        <div id="three-container" class="w-full h-full"></div>
      </div>

    </div>
  </section>
</main>

<script src="js/main.js"></script>
</body>
</html>
